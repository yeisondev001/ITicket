# CI: verifica cada cambio antes de que entre a develop o main.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (incluye chequeo de TypeScript)
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

  base-de-datos:
    name: Pruebas de base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta un Postgres de Supabase vacío y le aplica todas las migraciones.
      - name: Base de datos local con las migraciones
        run: supabase db start

      - name: Pruebas de RLS (pgTAP)
        run: supabase test db
