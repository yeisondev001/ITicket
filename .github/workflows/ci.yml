# CI: verifica cada cambio antes de que entre a develop o main.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (incluye chequeo de TypeScript)
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

  base-de-datos:
    name: Pruebas de base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta un Postgres de Supabase vacío y le aplica todas las migraciones.
      - name: Base de datos local con las migraciones
        run: supabase db start

      - name: Pruebas de RLS (pgTAP)
        run: supabase test db

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Revisa los tipos de cada Edge Function, como `npm run build` con el
      # frontend. Con createClient<Database> también detecta columnas y
      # valores de enum que no existen en la base de datos.
      - name: Revisar tipos (deno check)
        run: |
          shopt -s nullglob
          funciones=(supabase/functions/*/index.ts)
          if [ ${#funciones[@]} -eq 0 ]; then
            echo "Todavía no hay Edge Functions."
            exit 0
          fi
          deno check "${funciones[@]}"
