# CD de Supabase: despliega migraciones y Edge Functions despues de que el CI pasa.
#   develop -> ambiente "staging"    (proyecto Supabase de pruebas)
#   main    -> ambiente "production" (proyecto Supabase de produccion)
#
# Queda apagado (sin fallar) hasta que existan la carpeta supabase/ y estos
# secretos en Settings > Environments > staging / production:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
name: CD Supabase

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  desplegar:
    name: Desplegar a ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verificar configuracion
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ ! -d supabase ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CD de Supabase apagado: faltan los secretos del ambiente o la carpeta supabase/."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.listo == 'true'
        with:
          version: latest

      - name: Desplegar base de datos (migraciones)
        if: steps.config.outputs.listo == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Desplegar Edge Functions
        if: steps.config.outputs.listo == 'true' && hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
